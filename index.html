<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>É OS GIVO - Gerenciador de Farm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .neon-border {
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.25);
            border: 1px solid rgba(0, 242, 254, 0.4);
        }
        .neon-text {
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.6);
        }
    </style>
</head>
<body class="bg-[#090d16] text-slate-100 min-h-screen font-sans antialiased pb-12">

    <!-- TELA DE LOGIN -->
    <div id="loginScreen" class="fixed inset-0 bg-[#060910] z-50 flex items-center justify-center p-4">
        <div class="bg-[#111827] neon-border p-8 rounded-3xl shadow-2xl max-w-sm w-full space-y-6 text-center">
            
            <div class="space-y-3">
                <div class="w-32 h-32 mx-auto rounded-2xl overflow-hidden border-2 border-cyan-500/50 shadow-lg shadow-cyan-950 bg-black flex items-center justify-center">
                    <img src="https://media.discordapp.net/attachments/1556827955873972225/1569869452420325517/398a0706-2ebf-40e9-8f73-1c01685626bc.jpg?ex=6af5065c&is=6af3b4dc&hm=33eceadc84439972fbb0fd90e9ddb399fcf47107a204792cc62a511c5886ed87&=&format=webp&width=640&height=640" alt="É Os Givo Logo" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='https://images.vexels.com/content/users/preview/200091/11f81d1136b69b35061612a454d60d05.png';">
                </div>
                <h1 class="text-xl font-black uppercase tracking-wider text-white neon-text">É OS GIVO</h1>
                <p class="text-xs text-cyan-400 font-semibold tracking-widest uppercase">Controle de Farm & Baú</p>
            </div>

            <div class="space-y-4 pt-2">
                <div>
                    <label class="block text-xs font-bold text-cyan-400 uppercase mb-1.5">Seu ID ou Senha Master</label>
                    <input type="text" id="loginPassport" placeholder="Ex: 12" class="w-full bg-[#060910] border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400 text-center font-bold tracking-widest">
                </div>
                <button type="button" onclick="fazerLogin()" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-black py-3 px-4 rounded-xl text-sm transition uppercase tracking-wider cursor-pointer shadow-lg shadow-cyan-900/50">
                    Acessar Painel
                </button>
            </div>
        </div>
    </div>

    <!-- HEADER -->
    <header class="bg-[#111827] border-b border-cyan-900/40 shadow-xl sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl overflow-hidden border border-cyan-500/40 bg-black flex items-center justify-center">
                    <img src="https://media.discordapp.net/attachments/1556827955873972225/1569869452420325517/398a0706-2ebf-40e9-8f73-1c01685626bc.jpg?ex=6af5065c&is=6af3b4dc&hm=33eceadc84439972fbb0fd90e9ddb399fcf47107a204792cc62a511c5886ed87&=&format=webp&width=640&height=640" class="w-full h-full object-cover">
                </div>
                <div>
                    <h1 class="text-base font-black tracking-wider uppercase text-white">É OS GIVO</h1>
                    <p class="text-xs text-slate-400">Operador: <span id="userSessionBadge" class="text-cyan-400 font-bold"></span></p>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <div id="managerIndicator" class="hidden items-center gap-1.5 bg-amber-500/10 border border-amber-500/30 px-3 py-1 rounded-xl text-amber-400 text-xs font-extrabold uppercase">
                    <i class="fa-solid fa-crown"></i> Gerente
                </div>
                <button onclick="logout()" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 px-3 py-2 rounded-xl text-xs font-bold transition cursor-pointer">
                    <i class="fa-solid fa-right-from-bracket"></i> Sair
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 mt-6 space-y-8">

        <!-- PAINEL DO GERENTE -->
        <section id="managerPanel" class="bg-[#111827] neon-border p-6 rounded-2xl shadow-xl hidden space-y-4">
            <h2 class="text-base font-black text-amber-400 uppercase tracking-wide border-b border-slate-800 pb-2 flex items-center gap-2">
                <i class="fa-solid fa-user-shield"></i> Painel de Controle do Gerente
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-[#060910] p-4 rounded-xl border border-slate-800 space-y-3">
                    <h3 class="text-xs font-bold text-slate-300 uppercase">Definir Meta Semanal por ID</h3>
                    <input type="text" id="goalPassportInput" placeholder="ID do Membro (Ex: 12)" class="w-full bg-[#111827] border border-slate-700 rounded-lg px-3 py-2 text-sm text-white font-bold">
                    <input type="number" id="goalTargetValue" placeholder="Quantidade Meta (Ex: 1500)" class="w-full bg-[#111827] border border-slate-700 rounded-lg px-3 py-2 text-sm text-white font-bold">
                    <div class="flex gap-2">
                        <button onclick="salvarMeta()" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-2 rounded-lg text-xs uppercase cursor-pointer">Salvar Meta</button>
                        <button onclick="resetarSemana()" class="bg-red-500/20 text-red-400 border border-red-500/30 font-bold py-2 px-3 rounded-lg text-xs cursor-pointer">Resetar Semana</button>
                    </div>
                </div>
                <div class="bg-[#060910] p-4 rounded-xl border border-slate-800 space-y-2 flex flex-col">
                    <h3 class="text-xs font-bold text-slate-300 uppercase">IDs Ativos</h3>
                    <div id="activeIdsList" class="text-xs text-cyan-300 space-y-1 max-h-[100px] overflow-y-auto font-bold"></div>
                </div>
            </div>
        </section>

        <!-- ESTOQUE -->
        <section>
            <h2 class="text-base font-bold text-slate-200 uppercase tracking-wide mb-3 flex items-center gap-2">
                <i class="fa-solid fa-warehouse text-cyan-400"></i> Estoque Atual no Baú
            </h2>
            <div id="stockCards" class="grid grid-cols-1 sm:grid-cols-3 gap-4"></div>
        </section>

        <!-- FORMULÁRIO E METAS -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <section class="lg:col-span-1 bg-[#111827] neon-border p-6 rounded-2xl shadow-xl space-y-4">
                <h2 class="text-base font-bold text-cyan-400 uppercase tracking-wide border-b border-slate-800 pb-2 flex items-center gap-2">
                    <i class="fa-solid fa-circle-plus"></i> Registrar Movimentação
                </h2>
                
                <div class="space-y-3">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Seu ID</label>
                        <input type="text" id="memberName" readonly class="w-full bg-[#060910] border border-slate-800 rounded-xl px-3 py-2 text-sm text-cyan-400 font-black cursor-not-allowed">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Item</label>
                        <select id="itemSelect" class="w-full bg-[#060910] border border-slate-700 rounded-xl px-3 py-2 text-sm text-white font-bold">
                            <option value="Flor de Cannabis">Flor de Cannabis</option>
                            <option value="Thinner">Thinner</option>
                            <option value="Quetamina">Quetamina</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Operação</label>
                            <select id="actionType" class="w-full bg-[#060910] border border-slate-700 rounded-xl px-3 py-2 text-sm text-white font-bold">
                                <option value="entrada">Entrada (+)</option>
                                <option value="saida">Saída (-)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Qtd</label>
                            <input type="number" id="itemQuantity" min="1" placeholder="Ex: 100" class="w-full bg-[#060910] border border-slate-700 rounded-xl px-3 py-2 text-sm text-white font-bold">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Print do Baú (Obrigatório)</label>
                        <input type="file" id="bauPhoto" accept="image/*" class="w-full text-xs text-slate-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-cyan-500/10 file:text-cyan-400 cursor-pointer bg-[#060910] border border-slate-800 rounded-xl font-bold">
                    </div>
                    <button onclick="salvarFarm()" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-black py-3 rounded-xl text-xs uppercase tracking-wider cursor-pointer shadow-lg shadow-cyan-900/40">
                        Salvar Registro
                    </button>
                </div>
            </section>

            <section class="lg:col-span-2 bg-[#111827] neon-border p-6 rounded-2xl shadow-xl flex flex-col">
                <h2 class="text-base font-bold text-slate-200 uppercase tracking-wide border-b border-slate-800 pb-2 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-bullseye text-cyan-400"></i> Progresso das Metas Semanais
                </h2>
                <div class="space-y-3 flex-1 overflow-y-auto max-h-[320px]" id="goalsListContainer"></div>
            </section>
        </div>

        <!-- HISTÓRICO -->
        <section class="
