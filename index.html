<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Farm - Facção GTA RP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                        accent: '#10b981',
                        accenthover: '#059669'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkbg text-slate-100 min-h-screen font-sans antialiased pb-12">

    <!-- TELA DE LOGIN / CADASTRO -->
    <div id="loginScreen" class="fixed inset-0 bg-darkbg/95 z-50 flex items-center justify-center p-4">
        <div class="bg-cardbg border border-slate-700 p-8 rounded-2xl shadow-2xl max-w-md w-full space-y-6">
            <div class="text-center">
                <div class="bg-emerald-500/10 text-emerald-400 w-16 h-16 mx-auto rounded-2xl flex items-center justify-center border border-emerald-500/20 mb-3">
                    <i class="fa-solid fa-shield-halved text-3xl"></i>
                </div>
                <h1 class="text-xl font-bold">FARM GIVOS - SISTEMA</h1>
                <p class="text-xs text-slate-400 mt-1" id="authSubtitle">Entre com seu Passaporte e Senha</p>
            </div>

            <!-- FORMULÁRIO DE LOGIN -->
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Passaporte (ID)</label>
                    <input type="text" id="loginPassport" required placeholder="Digite seu passaporte" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Senha</label>
                    <input type="password" id="loginPassword" required placeholder="Sua senha" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 px-4 rounded-lg text-sm transition shadow-lg shadow-emerald-900/30">
                    Entrar no Sistema
                </button>
                <div class="flex justify-between items-center text-xs pt-2">
                    <span class="text-slate-500">Novo na facção?</span>
                    <button type="button" onclick="toggleAuthMode('register')" class="text-emerald-400 hover:underline font-semibold">Cadastrar Passaporte</button>
                </div>
            </form>

            <!-- FORMULÁRIO DE CADASTRO -->
            <form id="registerForm" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Nome / Vulgo no Jogo</label>
                    <input type="text" id="regName" required placeholder="Ex: Bolt" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Passaporte (ID Único)</label>
                    <input type="text" id="regPassport" required placeholder="Ex: 12" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Crie sua Senha</label>
                    <input type="password" id="regPassword" required placeholder="Sua senha" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 px-4 rounded-lg text-sm transition shadow-lg shadow-emerald-900/30">
                    Finalizar Cadastro
                </button>
                <div class="text-center text-xs pt-2">
                    <button type="button" onclick="toggleAuthMode('login')" class="text-slate-400 hover:underline">Já tenho cadastro (Voltar ao Login)</button>
                </div>
            </form>
        </div>
    </div>

    <!-- HEADER PRINCIPAL -->
    <header class="bg-cardbg border-b border-slate-700 shadow-lg sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-emerald-500/10 text-emerald-400 p-3 rounded-xl border border-emerald-500/20">
                    <i class="fa-solid fa-boxes-stacked text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">FARM GIVOS</h1>
                    <p class="text-xs text-slate-400">Logado como: <span id="userSessionBadge" class="text-emerald-400 font-semibold"></span></p>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <div id="managerIndicator" class="hidden items-center gap-2 bg-amber-500/10 border border-amber-500/30 px-3 py-1.5 rounded-lg text-amber-400 text-xs font-bold">
                    <i class="fa-solid fa-crown"></i> Modo Gerente Ativo
                </div>
                <button onclick="logout()" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 px-3 py-1.5 rounded-lg text-xs font-semibold transition">
                    <i class="fa-solid fa-right-from-bracket"></i> Sair
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 mt-6 space-y-8">

        <!-- PAINEL RESTRITO DO GERENTE -->
        <section id="managerPanel" class="bg-cardbg p-6 rounded-2xl border border-amber-500/30 shadow-xl hidden space-y-6">
            <div class="flex justify-between items-center pb-3 border-b border-slate-700">
                <h2 class="text-lg font-bold flex items-center gap-2 text-amber-400">
                    <i class="fa-solid fa-user-shield"></i> Painel de Controle do Gerente
                </h2>
                <span class="text-xs bg-amber-500/10 text-amber-400 px-2.5 py-1 rounded-md border border-amber-500/20 font-medium">Área Restrita</span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Definir Meta -->
                <div class="space-y-3">
                    <h3 class="text-sm font-semibold text-slate-300">Definir Meta Semanal (Geral)</h3>
                    <form id="goalForm" class="space-y-3">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Selecione o Membro Cadastrado</label>
                            <select id="goalPassportSelect" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
                                <!-- Preenchido com membros reais cadastrados -->
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Quantidade Meta Semanal (Total dos 3 itens)</label>
                            <input type="number" id="goalTargetValue" min="1" required placeholder="Ex: 1500" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
                        </div>
                        <div class="flex gap-2">
                            <button type="submit" class="flex-1 bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold py-2 px-3 rounded-lg text-xs transition">
                                Salvar Meta
                            </button>
                            <button type="button" onclick="resetAllGoalsAndLogs()" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 font-bold py-2 px-3 rounded-lg text-xs transition flex items-center gap-1.5">
                                <i class="fa-solid fa-rotate-right"></i> Resetar Semana
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Gestão de Cadastros dos Membros -->
                <div class="space-y-3">
                    <h3 class="text-sm font-semibold text-slate-300">Membros Cadastrados no Sistema</h3>
                    <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-3 max-h-[160px] overflow-y-auto divide-y divide-slate-800" id="registeredUsersList">
                        <!-- Lista de membros cadastrados -->
                    </div>
                </div>
            </div>
        </section>

        <!-- DASHBOARD DE ESTOQUE -->
        <section>
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold flex items-center gap-2 text-slate-200">
                    <i class="fa-solid fa-chart-pie text-emerald-400"></i> Estoque Atual no Baú
                </h2>
                <span class="text-xs text-slate-400 bg-cardbg px-3 py-1 rounded-full border border-slate-700">Atualizado em tempo real</span>
            </div>
            <div id="stockCards" class="grid grid-cols-1 sm:grid-cols-3 gap-4"></div>
